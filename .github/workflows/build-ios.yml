name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4


      - name: Installer XcodeGen
        run: brew install xcodegen


      - name: Préparer le projet iOS
        run: |
          mkdir -p App

          cp iOS/iPhoneWindowsUnlockApp.swift App/

          cat > project.yml <<'EOF'
          name: iPhoneWindowsUnlock

          options:
            bundleIdPrefix: com.n3vaaa

          targets:
            iPhoneWindowsUnlock:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - App

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.n3vaaa.iPhoneWindowsUnlock
                  SWIFT_VERSION: 5.0

              info:
                path: Info.plist
                properties:
                  NSBluetoothAlwaysUsageDescription:
                    "Utilisation du Bluetooth pour communiquer avec le PC Windows."
                  NSFaceIDUsageDescription:
                    "Utilisation de Face ID pour authentifier l'utilisateur."
          EOF


      - name: Générer le projet Xcode
        run: xcodegen generate


      - name: Compiler l'application
        run: |
          xcodebuild \
            -project iPhoneWindowsUnlock.xcodeproj \
            -scheme iPhoneWindowsUnlock \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath Build


      - name: Préparer le fichier App
        run: |
          mkdir -p Artifact

          cp -R \
          Build/Build/Products/Release-iphonesimulator/iPhoneWindowsUnlock.app \
          Artifact/


      - name: Sauvegarder l'application
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneWindowsUnlock-app
          path: Artifact/
