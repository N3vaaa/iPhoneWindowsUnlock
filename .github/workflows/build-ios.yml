name: Build iPhoneWindowsUnlock iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Préparer Swift
        run: |
          mkdir App
          cp iOS/iPhoneWindowsUnlockApp.swift App/iPhoneWindowsUnlockApp.swift

      - name: Créer projet Xcode
        run: |
          printf "name: iPhoneWindowsUnlock\n" > project.yml
          printf "options:\n" >> project.yml
          printf "  bundleIdPrefix: com.n3vaaa\n" >> project.yml
          printf "targets:\n" >> project.yml
          printf "  iPhoneWindowsUnlock:\n" >> project.yml
          printf "    type: application\n" >> project.yml
          printf "    platform: iOS\n" >> project.yml
          printf "    deploymentTarget: '17.0'\n" >> project.yml
          printf "    sources:\n" >> project.yml
          printf "      - App\n" >> project.yml

      - name: Générer Xcode
        run: xcodegen generate

      - name: Compiler
        run: xcodebuild -project iPhoneWindowsUnlock.xcodeproj -scheme iPhoneWindowsUnlock -sdk iphoneos build CODE_SIGNING_ALLOWED=NO
