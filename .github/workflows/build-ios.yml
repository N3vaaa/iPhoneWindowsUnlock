name: Build iPhoneWindowsUnlock iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Préparer les fichiers
        run: |
          mkdir -p App
          cp iOS/iPhoneWindowsUnlockApp.swift App/iPhoneWindowsUnlockApp.swift

      - name: Créer projet Xcode
        run: |
          cat > project.yml <<'EOF'
          name: iPhoneWindowsUnlock

          options:
            bundleIdPrefix: com.n3vaaa

          targets:
            iPhoneWindowsUnlock:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - App

              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.n3vaaa.iPhoneWindowsUnlock
                PRODUCT_NAME: iPhoneWindowsUnlock
                SWIFT_VERSION: "5.0"
                TARGETED_DEVICE_FAMILY: "1,2"
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_CFBundleDisplayName: "iPhone Windows Unlock"
                INFOPLIST_KEY_LSRequiresIPhoneOS: YES
                INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID est utilisé pour autoriser l'enregistrement sécurisé de cet iPhone."
          EOF

      - name: Générer Xcode
        run: |
          xcodegen generate

      - name: Compiler application
        run: |
          rm -rf Build

          xcodebuild \
            -project iPhoneWindowsUnlock.xcodeproj \
            -scheme iPhoneWindowsUnlock \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Vérifier application
        run: |
          APP_PATH="Build/Build/Products/Release-iphoneos/iPhoneWindowsUnlock.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERREUR : application introuvable"
            find Build -name "*.app" -print
            exit 1
          fi

          echo "Application trouvée :"
          echo "$APP_PATH"

          echo "Vérification Info.plist :"
          plutil -lint "$APP_PATH/Info.plist"

          echo "Vérification Face ID :"
          /usr/libexec/PlistBuddy \
            -c "Print :NSFaceIDUsageDescription" \
            "$APP_PATH/Info.plist"

      - name: Créer IPA
        run: |
          rm -rf Payload
          rm -f iPhoneWindowsUnlock.ipa

          mkdir Payload

          cp -R \
            "Build/Build/Products/Release-iphoneos/iPhoneWindowsUnlock.app" \
            "Payload/iPhoneWindowsUnlock.app"

          cd Payload

          zip -r -9 ../iPhoneWindowsUnlock.ipa \
            iPhoneWindowsUnlock.app

          cd ..

          echo "IPA créée :"
          ls -lh iPhoneWindowsUnlock.ipa

      - name: Vérifier IPA
        run: |
          unzip -t iPhoneWindowsUnlock.ipa

          unzip -l iPhoneWindowsUnlock.ipa | grep \
            "Payload/iPhoneWindowsUnlock.app/Info.plist"

      - name: Publier IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneWindowsUnlock-ipa
          path: iPhoneWindowsUnlock.ipa
