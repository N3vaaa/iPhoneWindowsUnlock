name: Build iPhoneWindowsUnlock iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4


      - name: Installer XcodeGen
        run: brew install xcodegen


      - name: Préparer Swift
        run: |
          mkdir App
          cp iOS/iPhoneWindowsUnlockApp.swift App/iPhoneWindowsUnlockApp.swift


      - name: Créer Info.plist
        run: |
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>iPhoneWindowsUnlock</string>
              <key>CFBundleIdentifier</key>
              <string>com.n3vaaa.iPhoneWindowsUnlock</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF


      - name: Créer projet Xcode
        run: |
          printf "name: iPhoneWindowsUnlock\n" > project.yml
          printf "options:\n" >> project.yml
          printf "  bundleIdPrefix: com.n3vaaa\n" >> project.yml
          printf "targets:\n" >> project.yml
          printf "  iPhoneWindowsUnlock:\n" >> project.yml
          printf "    type: application\n" >> project.yml
          printf "    platform: iOS\n" >> project.yml
          printf "    deploymentTarget: '17.0'\n" >> project.yml
          printf "    sources:\n" >> project.yml
          printf "      - App\n" >> project.yml
          printf "    info:\n" >> project.yml
          printf "      path: Info.plist\n" >> project.yml


      - name: Générer Xcode
        run: xcodegen generate


      - name: Compiler application
        run: |
          xcodebuild \
          -project iPhoneWindowsUnlock.xcodeproj \
          -scheme iPhoneWindowsUnlock \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath Build \
          build \
          CODE_SIGNING_ALLOWED=NO


      - name: Créer IPA
        run: |
          mkdir -p Payload

          cp -R \
          Build/Build/Products/Release-iphoneos/iPhoneWindowsUnlock.app \
          Payload/

          zip -r iPhoneWindowsUnlock.ipa Payload


      - name: Publier IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneWindowsUnlock-ipa
          path: iPhoneWindowsUnlock.ipa
