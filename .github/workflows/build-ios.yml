name: Build iPhoneWindowsUnlock iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Installer XcodeGen
        run: brew install xcodegen


      - name: Préparer Swift
        run: |
          mkdir -p App
          cp iOS/iPhoneWindowsUnlockApp.swift App/iPhoneWindowsUnlockApp.swift


      - name: Créer projet Xcode
        run: |
          cat > project.yml <<'EOF'
name: iPhoneWindowsUnlock

options:
  bundleIdPrefix: com.n3vaaa

targets:

  iPhoneWindowsUnlock:

    type: application

    platform: iOS

    deploymentTarget: "17.0"

    sources:
      - App

    settings:

      base:

        PRODUCT_BUNDLE_IDENTIFIER: com.n3vaaa.iPhoneWindowsUnlock

        SWIFT_VERSION: 5.0

        GENERATE_INFOPLIST_FILE: YES
EOF


      - name: Générer Xcode
        run: xcodegen generate


      - name: Compiler
        run: |
          xcodebuild \
          -project iPhoneWindowsUnlock.xcodeproj \
          -scheme iPhoneWindowsUnlock \
          -sdk iphoneos \
          -configuration Release \
          build \
          CODE_SIGNING_ALLOWED=NO
