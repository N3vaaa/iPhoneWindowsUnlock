name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Préparer le projet iOS
        run: |
          mkdir -p App
          cp iOS/iPhoneWindowsUnlockApp.swift App/

          cat > project.yml <<'EOF'
          name: iPhoneWindowsUnlock

          options:
            bundleIdPrefix: com.n3vaaa

          targets:
            iPhoneWindowsUnlock:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - App

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.n3vaaa.iPhoneWindowsUnlock
                  SWIFT_VERSION: 5.0

              info:
                path: Info.plist
                properties:
                  NSBluetoothAlwaysUsageDescription:
                    "Utilisation du Bluetooth pour communiquer avec le PC Windows."
          EOF

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler l'application
        run: |
          xcodebuild \
            -project iPhoneWindowsUnlock.xcodeproj \
            -scheme iPhoneWindowsUnlock \
            -sdk iphonesimulator \
            build

      - name: Sauvegarder le résultat
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneWindowsUnlock-build
          path: |
            ~/Library/Developer/Xcode/DerivedData/
