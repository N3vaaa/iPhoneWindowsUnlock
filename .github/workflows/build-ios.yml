name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier Xcode
        run: xcodebuild -version

      - name: Créer le projet Xcode
        run: |
          mkdir -p Build

          cat > Build/iPhoneWindowsUnlockApp.swift <<'EOF'
          $(cat iOS/iPhoneWindowsUnlockApp.swift)
          EOF

      - name: Afficher les fichiers
        run: |
          echo "Projet iOS préparé."
          find . -maxdepth 3 -type f
