name: Build iPhoneWindowsUnlock iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Installer XcodeGen
        run: brew install xcodegen


      - name: Préparer application
        run: |
          mkdir App
          cp iOS/iPhoneWindowsUnlockApp.swift App/main.swift


      - name: Créer project.yml
        shell: bash
        run: |
          echo 'name: iPhoneWindowsUnlock' > project.yml
          echo '' >> project.yml
          echo 'options:' >> project.yml
          echo '  bundleIdPrefix: com.n3vaaa' >> project.yml
          echo '' >> project.yml
          echo 'targets:' >> project.yml
          echo '  iPhoneWindowsUnlock:' >> project.yml
          echo '    type: application' >> project.yml
          echo '    platform: iOS' >> project.yml
          echo '    deploymentTarget: "17.0"' >> project.yml
          echo '    sources:' >> project.yml
          echo '      - App' >> project.yml


      - name: Générer projet Xcode
        run: xcodegen generate


      - name: Compiler
        run: |
          xcodebuild \
          -project iPhoneWindowsUnlock.xcodeproj \
          -scheme iPhoneWindowsUnlock \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          build


      - name: Créer IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/iPhoneWindowsUnlock.app Payload/
          zip -r iPhoneWindowsUnlock.ipa Payload


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneWindowsUnlock-ipa
          path: iPhoneWindowsUnlock.ipa
